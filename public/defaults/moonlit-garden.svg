<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit Garden</title>
  <desc id="desc">A pale moon above a dark garden of leaves and blossoms.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2d36"/>
      <stop offset=".48" stop-color="#243844"/>
      <stop offset="1" stop-color="#101d25"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1e6c8" stop-opacity=".72"/>
      <stop offset=".34" stop-color="#e7dfc9" stop-opacity=".2"/>
      <stop offset="1" stop-color="#dfe8de" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d9b88"/>
      <stop offset="1" stop-color="#4f5a55"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45685e"/>
      <stop offset="1" stop-color="#213b37"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54757b"/>
      <stop offset="1" stop-color="#203c44"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".075"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="softSmall"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#night)"/>
  <g fill="#d9e5df" opacity=".65">
    <circle cx="190" cy="148" r="2.2"/><circle cx="324" cy="244" r="1.7"/><circle cx="470" cy="119" r="2.4"/>
    <circle cx="620" cy="201" r="1.5"/><circle cx="746" cy="86" r="2"/><circle cx="905" cy="169" r="1.6"/>
    <circle cx="1020" cy="75" r="2.2"/><circle cx="1320" cy="159" r="1.9"/><circle cx="1432" cy="79" r="2.4"/>
    <circle cx="1510" cy="245" r="1.6"/><circle cx="870" cy="300" r="1.4"/><circle cx="400" cy="350" r="1.4"/>
  </g>
  <circle cx="1150" cy="258" r="305" fill="url(#halo)"/>
  <circle cx="1150" cy="258" r="116" fill="#f3ead2"/>
  <g fill="#d8d4be" opacity=".42">
    <circle cx="1112" cy="228" r="20"/><circle cx="1185" cy="277" r="13"/><circle cx="1140" cy="307" r="9"/>
  </g>

  <g fill="#36534e" opacity=".62" filter="url(#soft)">
    <ellipse cx="240" cy="570" rx="330" ry="128"/>
    <ellipse cx="1400" cy="610" rx="340" ry="142"/>
    <ellipse cx="808" cy="745" rx="440" ry="130"/>
  </g>

  <path d="M712 1000c6-176 39-287 92-379 38-66 57-117 38-178l230 2c-31 70-31 123 1 182 49 91 84 199 92 373Z" fill="url(#path)" opacity=".8"/>
  <ellipse cx="852" cy="768" rx="210" ry="70" fill="url(#pond)"/>
  <g fill="none" stroke="#aec2bc" stroke-width="3" opacity=".32">
    <path d="M720 754c62-13 123-13 185 0"/><path d="M830 793c43-8 85-8 128 0"/>
    <path d="M1130 914c54-9 105-9 157 0"/>
  </g>

  <g>
    <path d="M260 1000c0-171 35-300 98-389" fill="none" stroke="#506f60" stroke-width="16" stroke-linecap="round"/>
    <g fill="url(#leaf)">
      <ellipse cx="252" cy="810" rx="93" ry="34" transform="rotate(-34 252 810)"/>
      <ellipse cx="320" cy="725" rx="88" ry="31" transform="rotate(23 320 725)"/>
      <ellipse cx="254" cy="655" rx="72" ry="27" transform="rotate(-28 254 655)"/>
      <ellipse cx="352" cy="607" rx="64" ry="23" transform="rotate(43 352 607)"/>
      <ellipse cx="296" cy="897" rx="112" ry="35" transform="rotate(12 296 897)"/>
    </g>
    <g fill="#d9b5b2">
      <circle cx="229" cy="706" r="18"/><circle cx="247" cy="686" r="14"/><circle cx="209" cy="683" r="13"/><circle cx="225" cy="716" r="9"/>
      <circle cx="362" cy="668" r="14"/><circle cx="384" cy="682" r="11"/><circle cx="375" cy="649" r="10"/>
    </g>
  </g>

  <g>
    <path d="M1365 1000c-12-153-54-260-128-347" fill="none" stroke="#4c6a5e" stroke-width="18" stroke-linecap="round"/>
    <g fill="url(#leaf)">
      <ellipse cx="1354" cy="843" rx="99" ry="35" transform="rotate(31 1354 843)"/>
      <ellipse cx="1283" cy="751" rx="90" ry="31" transform="rotate(-21 1283 751)"/>
      <ellipse cx="1322" cy="664" rx="77" ry="26" transform="rotate(33 1322 664)"/>
      <ellipse cx="1246" cy="897" rx="104" ry="32" transform="rotate(-10 1246 897)"/>
    </g>
    <g fill="#efe1c3">
      <circle cx="1406" cy="783" r="13"/><circle cx="1426" cy="798" r="10"/><circle cx="1392" cy="805" r="9"/>
    </g>
  </g>

  <g fill="#4f7264">
    <path d="M67 1000c9-101 36-174 82-226-6 104-17 178-32 226ZM128 1000c-2-71 14-124 50-171 4 76-6 134-27 171Z"/>
    <path d="M1514 1000c-7-123-35-201-84-255 8 122 19 199 36 255ZM1453 1000c1-78-17-135-55-181-1 81 9 142 30 181Z"/>
  </g>

  <g fill="#e7ca88" filter="url(#softSmall)">
    <circle cx="610" cy="579" r="7"/><circle cx="1002" cy="630" r="6"/><circle cx="1238" cy="521" r="8"/>
    <circle cx="743" cy="510" r="5"/><circle cx="462" cy="643" r="5"/><circle cx="1104" cy="747" r="6"/>
    <circle cx="332" cy="540" r="4"/><circle cx="1328" cy="891" r="5"/>
  </g>
  <g fill="#f3dfae">
    <circle cx="610" cy="579" r="2.4"/><circle cx="1002" cy="630" r="2"/><circle cx="1238" cy="521" r="2.5"/>
    <circle cx="743" cy="510" r="1.6"/><circle cx="1104" cy="747" r="2"/><circle cx="462" cy="643" r="1.7"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
