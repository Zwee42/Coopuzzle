<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Long Road</title>
  <desc id="desc">A winding coastal road between green cliffs and a blue sea.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce6df"/>
      <stop offset=".55" stop-color="#eee4d1"/>
      <stop offset="1" stop-color="#f5d9bc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b9ba0"/>
      <stop offset=".55" stop-color="#50858e"/>
      <stop offset="1" stop-color="#356975"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#708b6b"/>
      <stop offset=".55" stop-color="#4d6d5b"/>
      <stop offset="1" stop-color="#2e4b42"/>
    </linearGradient>
    <linearGradient id="cliffLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#90a47a"/>
      <stop offset="1" stop-color="#5f7d62"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d8be"/>
      <stop offset="1" stop-color="#c9af8e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="350" cy="215" r="80" fill="#f8e3bd" opacity=".9"/>
  <circle cx="350" cy="215" r="154" fill="#f8e3bd" opacity=".17" filter="url(#soft)"/>
