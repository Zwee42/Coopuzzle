<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sunday Morning</title>
  <desc id="desc">Two cups of coffee, a small vase of flowers and sunlight on a table.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe2d0"/>
      <stop offset="1" stop-color="#dccab5"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dd" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff3d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a97458"/>
      <stop offset="1" stop-color="#855b49"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3cf"/>
      <stop offset=".55" stop-color="#d8d9c2"/>
      <stop offset="1" stop-color="#efd4ad"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d3f35"/>
      <stop offset="1" stop-color="#3c2c28"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

