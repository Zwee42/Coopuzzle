name: puzzle-together

services:
  puzzle-together:
    build:
      context: .
    image: puzzle-together:local
    container_name: puzzle-together
    init: true
    ports:
      - "${PUZZLE_PORT:-8787}:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      # Set to 1 only behind a trusted reverse proxy that sets X-Forwarded-For.
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      ROOM_TTL_DAYS: "${ROOM_TTL_DAYS:-30}"
      HOST_TRANSFER_DAYS: "${HOST_TRANSFER_DAYS:-14}"
      MAINTENANCE_INTERVAL_MINUTES: "${MAINTENANCE_INTERVAL_MINUTES:-60}"
      ORPHAN_UPLOAD_GRACE_HOURS: "${ORPHAN_UPLOAD_GRACE_HOURS:-24}"
      MAX_TOTAL_UPLOAD_MB: "${MAX_TOTAL_UPLOAD_MB:-2048}"
      MAX_ROOM_UPLOAD_MB: "${MAX_ROOM_UPLOAD_MB:-24}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      HSTS: "${HSTS:-0}"
      LOG_LEVEL: "${LOG_LEVEL:-}"
    volumes:
      - puzzle-data:/app/data
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  puzzle-data:
